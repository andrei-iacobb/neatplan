name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runner
            image: ghcr.io/andrei-iacobb/neatplan
          - target: migrator
            image: ghcr.io/andrei-iacobb/neatplan-migrator
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
            APP_GIT_BRANCH=${{ github.ref_name }}
            NEXT_PUBLIC_APP_BASE_URL=${{ vars.NEXT_PUBLIC_APP_BASE_URL || 'https://neatplan.app' }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL || vars.NEXT_PUBLIC_APP_BASE_URL || 'https://neatplan.app' }}
            CORS_ALLOWED_ORIGIN=${{ vars.CORS_ALLOWED_ORIGIN || vars.NEXT_PUBLIC_APP_BASE_URL || 'https://neatplan.app' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
