name: Container

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: neatplan-ci
  APP_GIT_SHA: ${{ github.sha }}
  APP_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
  POSTGRES_USER: neatplan_user
  POSTGRES_DB: neatplan
  POSTGRES_PASSWORD: ci-only-postgres-password
  POSTGRES_PORT: "55434"
  DATABASE_URL: postgresql://neatplan_user:ci-only-postgres-password@db:5432/neatplan?schema=public
  NEXTAUTH_URL: http://127.0.0.1:4040
  NEXTAUTH_SECRET: ci-only-nextauth-secret-00000000000000000000000000000000
  CRON_SECRET: ci-only-cron-secret-0000000000000000000000000000000000
  SCHEDULER_ENABLED: "false"
  NEATPLAN_PORT: "4040"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build production and migration images
        run: docker compose build --pull migrate web

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --detach db
          ready=0
          for attempt in {1..60}; do
            if docker compose exec --no-TTY db pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" -eq 1

      - name: Apply migrations once
        run: docker compose run --rm --no-deps migrate

      - name: Start hardened standalone server
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --detach --no-deps web
          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:4040/api/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" -eq 1

      - name: Smoke public routes and runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:4040/api/readyz
          curl --fail --silent --show-error \
            --output "${RUNNER_TEMP}/auth.html" \
            http://127.0.0.1:4040/auth
          grep --fixed-strings --quiet \
            "Professional cleaning management system" \
            "${RUNNER_TEMP}/auth.html"
          curl --fail --silent --show-error \
            --output "${RUNNER_TEMP}/demo.html" \
            http://127.0.0.1:4040/demo
          grep --fixed-strings --quiet \
            "Welcome to NeatPlan" \
            "${RUNNER_TEMP}/demo.html"

          web_id="$(docker compose ps --quiet web)"
          test "$(docker exec "${web_id}" id -u)" = "1001"
          if docker exec "${web_id}" touch /app/read-only-probe 2>/dev/null; then
            echo "/app unexpectedly accepted a write" >&2
            exit 1
          fi
          docker exec "${web_id}" sh -ec '
            touch /tmp/write-probe
            touch /app/data/write-probe
            touch /app/.next/cache/write-probe
            rm /tmp/write-probe /app/data/write-probe /app/.next/cache/write-probe
            test ! -e /app/.git
            test ! -e /app/.env
            test ! -e /app/tests
          '
          docker exec "${web_id}" tesseract --version

          docker exec --interactive "${web_id}" sh -c \
            'cat > /tmp/cleaning-schedule.png' \
            < tests/e2e/fixtures/cleaning-schedule.png
          docker exec "${web_id}" tesseract /tmp/cleaning-schedule.png stdout -l eng \
            | tee "${RUNNER_TEMP}/tesseract-output.txt"
          grep --ignore-case --extended-regexp --quiet \
            'clean|daily|weekly|schedule' "${RUNNER_TEMP}/tesseract-output.txt"

      - name: Container state and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Remove test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
