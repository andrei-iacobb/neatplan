# Packages allowed to run install scripts. Prisma generates its client here, and sharp,
# esbuild and unrs-resolver fetch native binaries, so without these the install produces
# a broken tree. pnpm 11 wants explicit booleans in allowBuilds and fails the install with
# ERR_PNPM_IGNORED_BUILDS otherwise; onlyBuiltDependencies is kept for older pnpm.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - framer-motion@13.1.0
  - tsx@4.23.12
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Security pins live here because pnpm 11 reads root overrides from the workspace
# configuration. Keeping a single source of truth avoids lockfile drift.
overrides:
  'brace-expansion@<2': '1.1.18'
  'brace-expansion@>=5 <6': '5.0.9'
  'esbuild@>=0.27.3 <0.28.1': '0.28.2'
  form-data: '>=4.0.6'
  postcss: '8.5.26'
  nanoid: '3.3.18'
  uuid: '>=13.0.1'

# NextAuth 4's peer range has not caught up with Nodemailer 9, even though the
# transport API used here is compatible. Nodemailer 7 is affected by multiple
# file-read, SSRF, and header-injection advisories, so accept the patched major.
peerDependencyRules:
  allowedVersions:
    nodemailer: '9'
